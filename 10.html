<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<style>

    .car {

        width: 50px;
        height: 50px;
        background-color: red;
        position: absolute;
        top: 50%;
        left: 0;
        animation: moveAcross 3s linear 1s infinite running,
                    blink 0.8s steps(2,start) infinite;
    }



    @keyframes moveAcross {
        from {
            transform: translateY(-50%) translateX(0);
        }
        to {
           transform: translateY(-50%) translateX(calc(100vw - 60px));
        }

    }
    @keyframes blink {
        0% {opacity: 1}
        50% {opacity: 0}
       100% {opacity: 1}

    }
    .oval{
        position: relative;
        display: inline-block;
        width: 70px;
        height: 44px;
    }
    .oval input {
        opacity: 0;
        width: 0;
        height: 0;
    }
    .round{
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        transition: 0.4s;
    }
    .round:before {
        position: absolute;
        content: "";
        height: 36px;
        width: 36px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        transition: 0.4s;
    }


    input:checked + .round:before {

        transform: translateX(26px);
    }
    .round.round {
        border-radius: 34px;
    }

    .round.round:before {
        border-radius: 50%;
    }

</style>
<body>
<div class ="car">car</div>
<label class="oval">
    <input type="checkbox">
    <span class="round round"></span>
</label>

<div ></div>>
</body>
</html>
